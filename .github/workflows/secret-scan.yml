name: secret-scan

# A second line of defence behind the pre-commit hook. It scans the commits that a pull request or a
# push to main adds, using the repo's .gitleaks.toml if it has one (otherwise gitleaks' built-in
# rules), and fails on any secret it finds. Findings are redacted in the log. The Mac runs the same
# command with `make secret-scan-ci`, but with whatever gitleaks version brew installed, so its
# rules can differ from the 8.30.1 pinned here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # GitHub's merge commit would repeat the whole PR under an id that changes on every run.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Nothing after checkout needs the token, and the job runs this PR's own Makefile.
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum from its release page)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan the new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # A force-push, a manual run or a new branch leaves no earlier commit to start from, so scan
          # every commit HEAD reaches rather than only the last one.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::No earlier commit to compare with; scanning the whole history."
            base="all"
          fi
          make secret-scan-ci BASE="$base"
