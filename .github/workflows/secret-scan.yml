name: secret-scan

# A second line of defence behind the pre-commit hook. It scans the commits that a pull request or a
# push to main adds, using the repo's .gitleaks.toml if it has one (otherwise gitleaks' built-in
# rules), and fails on any secret it finds. scripts/secret-scan-ci.sh does the scan, and the Mac
# runs the same thing with `make secret-scan-ci`. The script's header says what it scans and what
# it can't stop.
#
# Needs a person's sign-off: on a pull request GitHub runs the PR's own copy of this file, the
# Makefile, scripts/secret-scan-ci.sh, .gitleaks.toml, .gitleaksignore and .gitattributes, so a PR
# that changes any of them can weaken its own scan. GitHub Free can't pin them to main's copy.
# `make -f Makefile` stops a GNUmakefile or makefile added by the PR from being read in its place.
#
# Every EarlBear repo has this same file, byte for byte. A branch made before the check came in has
# no secret-scan-ci target, so its run fails until main is merged into it.
on:
  pull_request:
    # edited: when a PR's base branch changes, it is scanned again against the new base. GitHub
    # also sends it for a new title or description; that run repeats the same scan, in seconds.
    # The job skips closed and merged PRs (see its `if`).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same PR cancels the older one. Every other run (a push to main, a manual
# run) gets a group of its own kind and commit, so it is not cancelled by, or queued behind, a run
# of another kind.
concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    # A closed PR has nothing new to scan, and a merged one's commits are already in its base, so
    # a new title or description would give an empty range and a red X on a finished PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    # A pull request's own commits take seconds. A whole-history scan grows with the history: the
    # knowledge repo's 1,635 commits took about 1,000 CPU-seconds on 2026-11-18.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # GitHub's merge commit would repeat the whole PR under an id that changes on every run.
          ref: ${{ github.event.pull_request.head.sha }}
          # The scan needs the PR's base commit, and a manual run reads every commit.
          fetch-depth: 0
          # Nothing after checkout needs the token, and the job runs this PR's own Makefile.
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum from its release page)
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Scan the new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # A manual run, or a start commit this checkout lacks (a force-push to main whose old tip
          # is gone), leaves no earlier commit to start from, so scan every commit HEAD reaches
          # rather than only the last one. If the old tip is still on another branch, the range is
          # empty and the run fails loudly; a person then runs the workflow by hand, which scans all.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::No earlier commit to compare with; scanning the whole history."
            base=all
          fi
          make -f Makefile secret-scan-ci BASE="$base"
